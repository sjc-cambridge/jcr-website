{% macro item(obj) -%}
<li class="list-group-item">
    <div class="col">
        <div class="row"><span>
            <strong>{{obj.word}}&nbsp;</strong>
            <small>{{obj.type]}}</small>
            &nbsp;- {{obj.description}}
        </span></div>
        <div class="row"><span><small>"{{obj.usage]}}"</small></span></div>
    </div>
</li>
{%- endmacro %}

<!--
    JSON FORMAT:
    {
        word: string
        type: string
        description: string
        usage: string 
    }
-->
